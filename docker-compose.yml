version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: geotracking-postgres
    environment:
      POSTGRES_DB: geotracking
      POSTGRES_USER: geotracking
      POSTGRES_PASSWORD: geotracking
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geotracking -d geotracking"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/backend
    container_name: geotracking-backend
    environment:
      POSTGRES_DB: geotracking
      POSTGRES_USER: geotracking
      POSTGRES_PASSWORD: geotracking
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      APP_NAME: GeoTracking
      APP_ENV: development
      API_HOST: 0.0.0.0
      API_PORT: 8000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./apps/backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    image: node:20-alpine
    container_name: geotracking-web
    working_dir: /app
    volumes:
      - ./apps/web:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"

volumes:
  postgres_data:
